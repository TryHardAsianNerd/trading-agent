# Machine checks on every push to main and every PR (D-059): lint, the full test suite against the same
# Postgres and Redis as docker-compose.yml, and the PR code-size limit. No secrets:
# tests needing provider keys stub them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image and credentials as docker-compose.yml, so the default DATABASE_URL works.
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading_dev_only
          POSTGRES_DB: trading_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The size check diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Tests
        run: python -m pytest -rs
      - name: PR size
        if: github.event_name == 'pull_request'
        run: python scripts/pr_size.py origin/${{ github.base_ref }}
