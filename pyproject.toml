[project]
name = "trading-agent"
version = "0.1.0"
description = "Autonomous AI trading agent: US stocks (Alpaca), crypto (Coinbase Advanced Trade), Polymarket recommendations. Paper trading by default."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Pinned minor: 0.28 logs request URLs at INFO only, and FRED's URL carries the API
    # key (data/providers/fred.py). log.py pins the httpx logger to WARNING and redacts
    # api_key= at render, but re-verify both before widening.
    "httpx>=0.28,<0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.1",  # pool: the checkpointer connection pool
    "redis>=5.0",
    "apscheduler>=3.10,<4",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    # Pinned minor: 0.44's exception text is logged and verified secret-free; re-verify to widen.
    "alpaca-py>=0.44,<0.45",
    "coinbase-advanced-py>=1.7",
    "discord.py>=2.7,<2.8",
    "exchange-calendars>=4.5,<5",
    "pandas>=2.2",
    "tzdata",  # zoneinfo("America/New_York") on Windows: no system tz database (alpaca bars)
    # Directional model (D-024). Artifacts are XGBoost's native JSON; re-verify load compat to widen.
    "xgboost>=3.4,<4",
    "celery[redis]>=5.6,<5.7",  # background worker (D-025)
]

[project.optional-dependencies]
# FinBERT news sentiment (D-026): worker image only, never the host venv. CPU torch comes
# from the PyTorch index (see Dockerfile); requirements-sentiment.lock pins the full set.
sentiment = [
    "torch>=2.14,<3",
    "transformers>=5.17,<6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_agent = ["risk/macro_calendar.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# No indicator library (D-015): Tier-1 indicators are hand-rolled in src/trading_agent/features/.
